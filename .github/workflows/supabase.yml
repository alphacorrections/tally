name: Deploy Supabase

# Runs when anything under supabase/ changes on main, or by hand from the Actions tab.
# Needs three repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Database changes
        run: supabase db push --remote --yes
      - name: Server functions
        run: supabase functions deploy --use-api --yes
